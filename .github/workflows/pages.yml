name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ luis_branch ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Clean stale lock & cache to avoid npm/rollup optional deps bug
      - name: Clean lockfile & npm cache
        run: |
          rm -f package-lock.json
          npm cache clean --force || true

      - name: First install
        run: npm install --prefer-online --no-audit --no-fund

      # If rollup's native optional package didn't land (npm bug), reinstall once
      - name: Verify rollup optional dep; reinstall if missing
        run: |
          if [ ! -d node_modules/@rollup ] || ! ls node_modules/@rollup 2>/dev/null | grep -q "rollup-"; then
            echo "Rollup optional native package missing. Reinstalling once..."
            rm -rf node_modules package-lock.json
            npm cache clean --force || true
            npm install --prefer-online --no-audit --no-fund
          fi

      # Build Vite via Node to avoid CLI executable permission hiccups
      - name: Build (via Node entry)
        run: |
          node ./node_modules/vite/bin/vite.js build

      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
