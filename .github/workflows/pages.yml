name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ luis_branch ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # If a stale lockfile exists but you edit on GitHub, remove it so npm install resolves fresh
      - name: Remove lockfile if present
        run: |
          if [ -f package-lock.json ]; then
            echo "Removing out-of-sync package-lock.json"
            rm -f package-lock.json
          fi

      - name: Install dependencies
        run: npm install

      # 🔧 Call Vite via Node to avoid executable permission issues
      - name: Build (via Node entry)
        run: |
          if [ -f ./node_modules/vite/bin/vite.js ]; then
            node ./node_modules/vite/bin/vite.js build
          else
            # Fallback if vite wasn't installed for some reason
            npx --yes vite build
          fi

      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
