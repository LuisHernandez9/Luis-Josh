name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ luis_branch ]   # deploy from your working branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # SPA fallback so refresh on deep links doesn't 404
      - run: cp dist/index.html dist/404.html
      # Use the new pages artifact action (NOT the deprecated upload-artifact v3)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Use the new deploy action
      - id: deployment
        uses: actions/deploy-pages@v4
