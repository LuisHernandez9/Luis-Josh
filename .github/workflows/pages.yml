name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ luis_branch ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  # Force Rollup to use the JS implementation (not the native optional binary)
  ROLLUP_DISABLE_NATIVE: "1"
  # Make sure we’re installing to the repo root (change if your app is in a subfolder)
  APP_DIR: "."

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Clean any stale lockfile so npm doesn't try to enforce out-of-sync deps
      - name: Clean lockfile & cache (safe)
        working-directory: ${{ env.APP_DIR }}
        run: |
          rm -f package-lock.json
          npm cache clean --force || true

      # Install WITHOUT optional deps (skips platform-specific @rollup/rollup-*)
      - name: Install dependencies (no optional)
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-optional --prefer-online --no-audit --no-fund

      # Build Vite via Node entry (bypass executable bit)
      - name: Build (Vite via Node)
        working-directory: ${{ env.APP_DIR }}
        run: node ./node_modules/vite/bin/vite.js build

      - name: Add SPA fallback (404.html)
        working-directory: ${{ env.APP_DIR }}
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.APP_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
