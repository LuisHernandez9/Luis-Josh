name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ luis_branch ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  ROLLUP_DISABLE_NATIVE: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Start clean so npm resolves using overrides
      - name: Clean lockfile & cache
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm cache clean --force || true

      # Install WITHOUT optional deps (skips @rollup/rollup-* entirely)
      - name: Install dependencies (no optional)
        run: npm install --no-optional --prefer-online --no-audit --no-fund

      # Build via Node (avoid CLI exec-bit issues)
      - name: Build (Vite via Node)
        run: node ./node_modules/vite/bin/vite.js build

      - name: Add SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
