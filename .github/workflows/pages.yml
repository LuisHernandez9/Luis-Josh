name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ luis_branch ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show repo layout (top level)
        run: |
          echo "PWD: $PWD"
          ls -la

      - name: Detect app directory (has package.json with vite build)
        id: detect
        shell: bash
        run: |
          set -e
          CANDIDATES=$(find . -maxdepth 3 -type f -name package.json | sort)
          echo "Found package.json candidates:"
          echo "$CANDIDATES"
          APP_DIR=""
          for p in $CANDIDATES; do
            d=$(dirname "$p")
            echo "Checking $p"
            if jq -e '.scripts.build? | contains("vite")' "$p" >/dev/null 2>&1 || \
               jq -e '.devDependencies?."@vitejs/plugin-react"' "$p" >/dev/null 2>&1 || \
               jq -e '.dependencies?."vite"' "$p" >/dev/null 2>&1; then
              APP_DIR="$d"
              break
            fi
          done
          if [ -z "$APP_DIR" ]; then
            echo "::error ::No Vite app detected. Ensure package.json exists and has a 'build' script using Vite."
            exit 1
          fi
          echo "APP_DIR=$APP_DIR" | tee -a $GITHUB_OUTPUT
          echo "Using APP_DIR=$APP_DIR"
          echo "Contents of APP_DIR:"
          ls -la "$APP_DIR"

      - name: Show Node/npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies (ci if lockfile, else install)
        working-directory: ${{ steps.detect.outputs.APP_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build (npm run build or fallback to vite)
        working-directory: ${{ steps.detect.outputs.APP_DIR }}
        run: |
          if npm run | grep -q "^  build$"; then
            npm run build
          else
            npx vite build
          fi

      - name: Ensure dist exists & add SPA fallback
        working-directory: ${{ steps.detect.outputs.APP_DIR }}
        run: |
          if [ ! -d dist ]; then
            echo "::error ::Build succeeded but 'dist' was not found. Check your build output config."
            exit 1
          fi
          cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.APP_DIR }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
